name: Release

# Every push to main builds signed phone + watch APKs and publishes a GitHub Release
# (tag v<versionName>, versionName = <VERSION_MAJOR_MINOR>.<commit count>). Skips if the tag exists.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "cast-receiver/**"]
  workflow_dispatch:
    inputs:
      minify:
        description: "R8-shrink the release APKs"
        type: boolean
        default: true

permissions:
  contents: write

env:
  RELEASES_TOKEN: ${{ secrets.SCOREUP_RELEASES_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: v
        run: |
          mm="$(sed -n 's/^VERSION_MAJOR_MINOR=//p' version.properties)"
          echo "name=${mm}.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: Skip if released
        id: skip
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "v${{ steps.v.outputs.name }}" > /dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Restore release key (optional; falls back to the committed dev key)
        if: steps.skip.outputs.skip != 'true'
        env: { KEYSTORE_BASE64: "${{ secrets.SCOREUP_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SCOREUP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Test + build
        if: steps.skip.outputs.skip != 'true'
        env:
          SCOREUP_KEYSTORE_PASSWORD: ${{ secrets.SCOREUP_KEYSTORE_PASSWORD }}
          SCOREUP_KEY_ALIAS: ${{ secrets.SCOREUP_KEY_ALIAS }}
          SCOREUP_KEY_PASSWORD: ${{ secrets.SCOREUP_KEY_PASSWORD }}
          SCOREUP_CAST_APP_ID: ${{ vars.SCOREUP_CAST_APP_ID }}
        run: ./gradlew --no-daemon :core:test :adb:test :app:testDebugUnitTest :wear:testDebugUnitTest :app:assembleRelease :wear:assembleRelease -Pscoreup.minify=${{ github.event_name != 'workflow_dispatch' || inputs.minify }}
      - name: Publish
        if: steps.skip.outputs.skip != 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v="${{ steps.v.outputs.name }}"
          cp app/build/outputs/apk/release/app-release.apk "ScoreUp-phone-${v}.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "ScoreUp-watch-${v}.apk"
          sha256sum ScoreUp-*.apk > SHA256SUMS.txt
          gh release create "v${v}" ScoreUp-*.apk SHA256SUMS.txt --title "ScoreUp ${v}" --notes "$(git log -1 --pretty=%B)"
      - name: Publish to public downloads repo
        if: steps.skip.outputs.skip != 'true' && env.RELEASES_TOKEN != ''
        env: { RELEASES_TOKEN: "${{ secrets.SCOREUP_RELEASES_TOKEN }}" }
        run: |
          v="${{ steps.v.outputs.name }}"; code=$((1000 + $(git rev-list --count HEAD)))
          git clone -q "https://x-access-token:${RELEASES_TOKEN}@github.com/il90il90/scoreup-releases.git" "$RUNNER_TEMP/rel"
          git -C "$RUNNER_TEMP/rel" config user.name scoreup-ci; git -C "$RUNNER_TEMP/rel" config user.email ci@scoreup.invalid
          scripts/publish-release.sh "$RUNNER_TEMP/rel" "ScoreUp-phone-${v}.apk" "ScoreUp-watch-${v}.apk" "$v" "$code" "$(git log -1 --pretty=%B)"
          git -C "$RUNNER_TEMP/rel" push -q origin HEAD:main
